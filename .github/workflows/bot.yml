name: Bot Notificador YouTube

on:
  schedule:
    # Se ejecuta automáticamente cada 10 minutos
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permite forzar una ejecución manual desde la web cuando quieras

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # Da permisos de escritura para actualizar los archivos JSON de historial
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar bot
        run: python bot.py

      - name: Guardar cambios en el historial (JSON)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Añade los archivos de registro si cambian
          git add vh_videos.json vh_streams.json || true
          
          # Hace commit y sube los cambios para que no repita el aviso
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizar historial de notificaciones [skip ci]" && git push)
